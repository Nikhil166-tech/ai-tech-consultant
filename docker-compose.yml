services:
  task1:
    build:
      context: ./task-1-knowledge-brain
      dockerfile: Dockerfile
    container_name: task1-knowledge-brain
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENABLE_DAILY_SYNC=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL_TEXT=${ANTHROPIC_MODEL_TEXT:-claude-haiku-5-5}
      - ANTHROPIC_MODEL_VISION=${ANTHROPIC_MODEL_VISION:-claude-sonnet-5-5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  task2:
    build:
      context: ./task-2-inbox-agent
      dockerfile: Dockerfile
    container_name: task2-inbox-agent
    ports:
      - "3000:3000"
    depends_on:
      task1:
        condition: service_healthy
    environment:
      - PORT=3000
      - TASK1_API_URL=http://task1:8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL_TEXT=${ANTHROPIC_MODEL_TEXT:-claude-haiku-5-5}

  task3:
    build:
      context: ./task-3-meeting-sow
      dockerfile: Dockerfile
    container_name: task3-meeting-sow
    ports:
      - "8002:8002"
    depends_on:
      task1:
        condition: service_healthy
    environment:
      - PORT=8002
      - TASK1_API_URL=http://task1:8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL_TEXT=${ANTHROPIC_MODEL_TEXT:-claude-haiku-5-5}
